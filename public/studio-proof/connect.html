<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>vyvyd · HTTPS 로컬 연결 검증</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b0c10;color:#eeeaf8;font:15px/1.6 system-ui,sans-serif;padding:48px 24px}main{max-width:760px;margin:auto}h1{font-size:28px}p{color:#b3adc3}button{background:#7c3aed;color:white;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font:inherit}button:disabled{opacity:.5}code{color:#c4b5fd}pre{white-space:pre-wrap;padding:18px;background:#15131e;border-radius:12px}iframe{display:block;width:100%;height:340px;border:1px solid #34303f;border-radius:12px;margin-top:24px}.badge{color:#c4b5fd;font-size:12px;letter-spacing:2px}
  </style>
</head>
<body>
  <main>
    <p class="badge">VYVYD · STAGE 0</p>
    <h1>HTTPS 화면 ↔ 로컬 서비스 연결 검증</h1>
    <p>연결 상태와 검증용 이미지만 확인합니다. 프로젝트 파일이나 개인정보는 요청하지 않습니다.</p>
    <p>로컬에서 <code>npm run studio:proof:server</code> 실행 후 연결을 확인하세요.</p>
    <button id="connect" type="button">로컬 서비스 연결 확인</button>
    <button id="frame" type="button">로컬 iframe만 확인</button>
    <pre id="status" role="status">아직 연결하지 않았습니다.</pre>
    <div id="preview"></div>
  </main>
  <script type="module">
    const button=document.getElementById('connect');
    const status=document.getElementById('status');
    const preview=document.getElementById('preview');
    const local='http://127.0.0.1:4179';
    function showFrame() {
      const iframe=document.createElement('iframe');
      iframe.title='로컬 서비스 화면·이미지 연결 검증';
      iframe.src=`${local}/preview`;
      preview.replaceChildren(iframe);
    }
    document.getElementById('frame').addEventListener('click',()=>{
      showFrame();
      status.textContent=`iframe 연결 시험\norigin: ${location.origin}\nHTTPS: ${location.protocol==='https:'}\ncrossOriginIsolated: ${window.crossOriginIsolated}\n아래에 로컬 화면과 궤도 이미지가 실제로 보이는지 확인하세요. HTTP API의 연결 성공을 의미하지는 않습니다.`;
    });
    button.addEventListener('click',async()=>{
      button.disabled=true;
      status.textContent=`현재 origin: ${location.origin}\nHTTPS: ${location.protocol==='https:'}\ncrossOriginIsolated: ${window.crossOriginIsolated}\n로컬 응답 확인 중…`;
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),10000);
      try {
        const response=await fetch(`${local}/health`,{signal:controller.signal});
        if(!response.ok)throw new Error(`HTTP ${response.status}`);
        const health=await response.json();
        if(health.stage!==0||health.status!=='ok'||health.protocolVersion!==1)throw new Error('검증 서비스 응답이 다릅니다.');
        status.textContent=`HTTP 연결 성공\norigin: ${location.origin}\nHTTPS: ${location.protocol==='https:'}\ncrossOriginIsolated: ${window.crossOriginIsolated}\n응답: ${JSON.stringify(health)}\n아래에 로컬 서비스의 화면과 궤도 이미지가 보이면 iframe·이미지 연결도 성공입니다.`;
        showFrame();
      } catch(error) {
        status.textContent+=`\n연결 실패: ${error.message}\n서비스 실행, 정확한 Origin 허용 목록, 브라우저의 로컬 네트워크 권한을 확인하세요. HTTPS 연결이 성공했다고 처리하지 않습니다.`;
      } finally {
        clearTimeout(timeout);
        button.disabled=false;
      }
    });
  </script>
</body>
</html>
